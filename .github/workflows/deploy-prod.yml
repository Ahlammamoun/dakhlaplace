name: Deploy DakhlaPlace

on:
  push:
    branches:
      - prod

concurrency:
  group: dakhlaplace-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy DakhlaPlace
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            echo "======================================"
            echo "Deploying DakhlaPlace"
            echo "======================================"

            cd /var/www/dakhla

            echo "1. Fetch Git repository"
            git fetch origin

            echo "2. Checkout production branch"
            git checkout prod

            echo "3. Update production code"
            git reset --hard origin/prod

            echo "4. Build Docker containers"
            docker compose build --pull

            echo "5. Start containers"
            docker compose up -d --remove-orphans

            echo "6. Install Symfony dependencies"
            docker compose exec -T backend \
              composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            echo "7. Run database migrations"
            docker compose exec -T backend \
              php bin/console doctrine:migrations:migrate \
              --no-interaction \
              --allow-no-migration \
              --env=prod

            echo "8. Clear Symfony cache"
            docker compose exec -T backend \
              php bin/console cache:clear \
              --env=prod

            echo "9. Restart containers"
            docker compose up -d

            echo "10. Containers status"
            docker compose ps

            echo "======================================"
            echo "DakhlaPlace deployment completed"
            echo "======================================"
          EOF
