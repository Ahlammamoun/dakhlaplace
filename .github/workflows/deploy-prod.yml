name: Deploy DakhlaPlace

on:
  push:
    branches:
      - prod

concurrency:
  group: dakhlaplace-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy DakhlaPlace
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            APP_DIR="/var/www/dakhla"
            REPO="git@github.com:Ahlammamoun/dakhlaplace.git"
            COMPOSE="docker-compose --env-file .env.prod -f docker-compose.prod.yml"

            echo "======================================"
            echo "Deploying DakhlaPlace"
            echo "======================================"

          if [ ! -d "$APP_DIR/.git" ]; then
          echo "First deployment - initializing repository"

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          git init
          git remote add origin "$REPO"
          git fetch origin prod
          git checkout -B prod origin/prod
          else
            cd "$APP_DIR"
          fi

            echo "Updating production branch"

            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            echo "Building containers"
            $COMPOSE build --pull

            echo "Starting containers"
            $COMPOSE up -d --remove-orphans

            echo "Running migrations"
            $COMPOSE exec -T backend \
              php bin/console doctrine:migrations:migrate \
              --no-interaction \
              --allow-no-migration \
              --env=prod

            echo "Clearing Symfony cache"
            $COMPOSE exec -T backend \
              php bin/console cache:clear \
              --env=prod

            echo "Container status"
            $COMPOSE ps

            echo "======================================"
            echo "DakhlaPlace deployment completed"
            echo "======================================"
          EOF