name: Deploy DakhlaPlace

on:
  push:
    branches:
      - prod

concurrency:
  group: dakhlaplace-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

            - name: Deploy DakhlaPlace
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            APP_DIR="/var/www/dakhla"
            REPO="git@github.com:Ahlammamoun/dakhlaplace.git"

            echo "======================================"
            echo "Deploying DakhlaPlace"
            echo "======================================"

            # Premier déploiement
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First deployment - cloning repository"

              mkdir -p "$APP_DIR"

              git clone \
                --branch prod \
                --single-branch \
                "$REPO" \
                "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Déploiements suivants
            echo "Updating production branch"

            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            echo "Building containers"
            docker compose build --pull

            echo "Starting containers"
            docker compose up -d --remove-orphans

            echo "Installing Symfony production dependencies"
            docker compose exec -T backend \
              composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            echo "Running migrations"
            docker compose exec -T backend \
              php bin/console doctrine:migrations:migrate \
              --no-interaction \
              --allow-no-migration \
              --env=prod

            echo "Clearing Symfony cache"
            docker compose exec -T backend \
              php bin/console cache:clear \
              --env=prod

            echo "Container status"
            docker compose ps

            echo "======================================"
            echo "DakhlaPlace deployment completed"
            echo "======================================"
          EOF