security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\ApiAuthenticationEntryPoint

            json_login:
                check_path: api_login
                username_path: email
                password_path: password

            logout:
                path: api_logout

    access_control:
        - {
              path: ^/api/login$,
              roles: PUBLIC_ACCESS
          }
        - {
              path: ^/api/health$,
              roles: PUBLIC_ACCESS
          }
        - {
              path: ^/api/newsletter/subscribe$,
              roles: PUBLIC_ACCESS,
              methods: [POST]
          }
        - {
              path: ^/api/contact$,
              roles: PUBLIC_ACCESS,
              methods: [POST]
          }
        - {
              path: ^/api/content,
              roles: PUBLIC_ACCESS,
              methods: [GET]
          }
        - {
              path: ^/api/social-networks$,
              roles: PUBLIC_ACCESS,
              methods: [GET]
          }
        - {
              path: ^/api/admin,
              roles: ROLE_ADMIN
          }
        - {
              path: ^/api/me$,
              roles: ROLE_USER
          }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10