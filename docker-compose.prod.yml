services:
  db:
    image: mysql:8.4
    container_name: dakhla_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dakhla_db_data:/var/lib/mysql
    networks:
      - dakhla_network

  backend:
    build:
      context: ./backend
    container_name: dakhla_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      DEFAULT_URI: ${DEFAULT_URI}
    depends_on:
      - db
    networks:
      - dakhla_network

  frontend:
    build:
      context: ./frontend
    container_name: dakhla_frontend
    restart: unless-stopped
    networks:
      - dakhla_network

  nginx:
    image: nginx:1.27-alpine
    container_name: dakhla_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dakhla_network

volumes:
  dakhla_db_data:

networks:
  dakhla_network:
    external: true
